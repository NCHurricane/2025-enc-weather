<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1441.54 186.05">
  <defs>
    <style>
      .cls-1 {
        fill: currentColor;
        stroke: #000;
        stroke-miterlimit: 10;
        stroke-width: 3px;
      }

      .cls-2 {
        fill: #007aff;
      }

      .cls-3 {
        fill: red;
      }

      #cyclone-icon {
        animation: cyclone-icon-spin 5.4s ease-in-out infinite, cyclone-icon-flash 5.4s ease-in-out infinite;
        color: #ff0;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes cyclone-icon-spin {
        0% {
          transform: rotate(0deg);
        }

        9%,
        100% {
          transform: rotate(-360deg);
        }
      }

      @keyframes cyclone-icon-flash {
        0%,
        4%,
        9%,
        100% {
          color: #ff0;
          filter: none;
          opacity: .88;
        }

        2%,
        7% {
          color: #fff;
          filter: drop-shadow(0 0 5px rgba(255, 242, 0, .95));
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #cyclone-icon {
          animation: none;
          color: #ff0;
          filter: none;
          opacity: 1;
        }
      }
    </style>
  </defs>
