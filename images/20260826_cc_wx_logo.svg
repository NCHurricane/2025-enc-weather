  <defs>
    <style>
      .cls-1 {
        fill: #007aff;
        stroke: #007aff;
      }

      .cls-1, .cls-2 {
        stroke-miterlimit: 10;
        stroke-width: 2px;
      }

      .cls-2 {
        fill: red;
        stroke: red;
      }

      .cls-3 {
        fill: currentColor;
      }

      #lightning-bolt {
        animation: lightning-bolt-flash 5.4s ease-in-out infinite;
        color: #ff0;
      }

      @keyframes lightning-bolt-flash {
        0%,
        4%,
        9%,
        100% {
          color: #ff0;
          filter: none;
          opacity: .88;
        }

        2%,
        7% {
          color: #fff;
          filter: drop-shadow(0 0 5px rgba(255, 242, 0, .95));
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #lightning-bolt {
          animation: none;
          color: #ff0;
          filter: none;
          opacity: 1;
        }
      }
    </style>
